apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sqlserver.yaml
  - rabbitmq.yaml
  - redis.yaml
  - mongodb.yaml
  - elasticsearch.yaml
  - database/database-init-job.yaml
  # Secrets are applied separately (see scripts/apply-k8s-secrets.sh).
  # Do not commit real credentials into this repo.
configMapGenerator:
  - name: fcg-database-schema
    files:
      - database/scripts/000-create-databases.sql
      - database/scripts/010-users-schema.sql
      - database/scripts/020-catalog-schema.sql
generatorOptions:
  disableNameSuffixHash: true
