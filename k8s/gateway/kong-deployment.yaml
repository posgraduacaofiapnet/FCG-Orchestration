apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-gateway
  template:
    metadata:
      labels:
        app: kong-gateway
    spec:
      initContainers:
        - name: render-kong-config
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - sed "s|__JWT_KEY__|$FCG_JWT_KEY|g" /template/kong.yml.template > /rendered/kong.yml
          env:
            - name: FCG_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: kong-gateway-secrets
                  key: FCG_JWT_KEY
          volumeMounts:
            - name: kong-config-template
              mountPath: /template
              readOnly: true
            - name: kong-rendered-config
              mountPath: /rendered
      containers:
        - name: kong-gateway
          image: kong/kong-gateway:3.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 8000
            - name: status
              containerPort: 8100
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /usr/local/kong/declarative/kong.yml
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_ADMIN_LISTEN
              value: "off"
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:8100
          volumeMounts:
            - name: kong-rendered-config
              mountPath: /usr/local/kong/declarative
              readOnly: true
          readinessProbe:
            httpGet:
              path: /status
              port: status
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: status
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: kong-config-template
          configMap:
            name: kong-gateway-config
        - name: kong-rendered-config
          emptyDir: {}
